name: Publish installer release

on:
  workflow_call:
    inputs:
      run_id: { type: string, required: true }
      tag: { type: string, required: false }
      notes: { type: string, required: false }
      prerelease: { type: boolean, default: true }
      draft: { type: boolean, default: true }
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id whose bundle-windows artifact to stage (fallback; ci.yml stages by itself)
        required: true
      tag:
        description: 'Blank = from the MSI name (<ver> or <ver>-testing.<date>). Given: must equal it'
        required: false
      notes:
        description: Extra line for the release notes (resolved components)
        required: false
      prerelease:
        description: Mark as pre-release (soft release, not flagged "Latest")
        type: boolean
        default: true
      draft:
        description: Create as a draft (private until the signed MSI is verified and published)
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      actions: read     # read the artifact from the other run
    steps:
      - name: Download the vetted artifact (exact bytes, no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: bundle-windows
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what will be published
        run: ls -l out

      - name: Create the release with the MSI + checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the MSI name carries the identity: catala-<ver>[-testing.<date>]-windows-x86_64[-unsigned].msi
          MSI=$(basename "$(ls out/catala-*.msi | head -1)")
          VER=${MSI#catala-}; VER=${VER%%-windows-x86_64*}
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] || [ "$TAG" = "$VER" ] || { echo "::error::tag $TAG does not match the bundle $VER (from $MSI)"; exit 1; }
          TAG=$VER
          BUILT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" --jq .head_sha)
          echo "Publishing tag: $TAG  (installer commit $BUILT)"
          flags=""
          [ "${{ inputs.prerelease }}" = "true" ] && flags="$flags --prerelease"
          [ "${{ inputs.draft }}" = "true" ] && flags="$flags --draft"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            $flags \
            --title "Catala Windows installer — $TAG" \
            --notes "Windows installer, promoted from CI run ${{ inputs.run_id }} (installers commit $BUILT). ${{ inputs.notes }} Exact component SHAs are in \`manifest.json\` inside the install." \
            out/catala-*.msi out/catala-*.msi.sha256
